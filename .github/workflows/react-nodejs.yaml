name: react ci pipeline
on:
 push:
   branches:
      - main
permissions:
  contents: read
  checks: write
  security-events: write
jobs:
   build:
    runs-on: ubuntu-latest
    steps:
         - name: Checkout Repository
           uses: actions/checkout@v5
         
         - name: Initialize CodeQL
           uses: github/codeql-action/init@v4
           with:
              languages: javascript-typescript

         - name: Setup Node.js
           uses: actions/setup-node@v5
           with:
              node-version: 20

         - name: Install Dependencies
           working-directory: ./backend
           run: npm install

         - name: Install Dependencies
           working-directory: ./frontend
           run: npm install


         - name: Run Tests
           working-directory: ./frontend
           run: |
              npx vitest --run \
              --reporter=default \
              --reporter=junit \
              --outputFile=test-results.xml

         - name: Publish Test Results
           uses: EnricoMi/publish-unit-test-result-action@v2
           if: always()
           with:
              files: |
                 frontend/test-results.xml

         - name: Build React App
           working-directory: ./frontend
           run: npm run build

         - name: Perform CodeQL Analysis
           uses: github/codeql-action/analyze@v4
         
         - name: Upload Build Artifact
           uses: actions/upload-artifact@v4
           with:
              name: react-build
              path: frontend/dist/

         - name: Build Docker Image
           run: |
              docker build -t ${{ vars.DOCKERHUB_USERNAME }}/be:1.0 ./backend

         - name: Scan Backend Image with Trivy
           uses: aquasecurity/trivy-action@v0.36.0
           with:
             scan-type: image
             image-ref: ${{ vars.DOCKERHUB_USERNAME }}/be:1.0
             severity: HIGH,CRITICAL
             exit-code: '1'
         
         - name: Tag image 
           run: |
             docker tag ${{ vars.DOCKERHUB_USERNAME }}/be:1.0  \
                     ${{ vars.DOCKERHUB_USERNAME }}/be:latest

          
         - name: Build Docker Image
           run: |
              docker build -t ${{ vars.DOCKERHUB_USERNAME }}/fe:1.0 ./frontend

         - name: Scan Frontend Image with Trivy
           uses: aquasecurity/trivy-action@v0.36.0
           with:
             scan-type: image
             image-ref: ${{ vars.DOCKERHUB_USERNAME }}/fe:1.0
             severity: HIGH,CRITICAL
             exit-code: '1'
         
         - name: Tag image 
           run: |
             docker tag ${{ vars.DOCKERHUB_USERNAME }}/fe:1.0  \
                     ${{ vars.DOCKERHUB_USERNAME }}/fe:latest

         - name: Login to Docker Hub
           uses: docker/login-action@v4
           with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
         
         - name: Push Docker Image
           run: |
              docker push ${{ vars.DOCKERHUB_USERNAME }}/be:latest 
         
         
         - name: Push Docker Image
           run: |
              docker push ${{ vars.DOCKERHUB_USERNAME }}/fe:latest 
         
         - name: Azure Login
           uses: azure/login@v2
           with:
              creds: ${{ secrets.AZURE_CREDENTIALS }}

         - name: Setup Terraform
           uses: hashicorp/setup-terraform@v3

         - name: Terraform Init
           run: terraform init
           working-directory: ./terraform

         - name: Terraform Format Check
           run: terraform fmt 
           working-directory: ./terraform

         - name: Terraform Validate
           run: terraform validate
           working-directory: ./terraform

         - name: Terraform Plan
           run: terraform plan
           working-directory: ./terraform

         - name: Terraform Apply
           run: terraform apply -auto-approve
           working-directory: ./terraform
         
         - name: Setup Kubectl
           uses: azure/setup-kubectl@v4
           with:
              version: latest

         - name: Get AKS Credentials
           run: |
              az aks get-credentials \
              --resource-group myRG \
              --name myAKSCluster \
              --overwrite-existing

         - name: Verify Cluster
           run: kubectl get nodes
         
        
         
         

         

         


         
         

         